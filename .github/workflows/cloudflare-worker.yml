name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          # wrangler.toml 里的 vars (OPENAI_BASE_URL, OPENAI_MODEL) 会自动注入
          # 但 secret (OPENAI_API_KEY) 需要单独传
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Set Worker secret OPENAI_API_KEY
        run: |
          echo "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --name anger-ai-game-api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
